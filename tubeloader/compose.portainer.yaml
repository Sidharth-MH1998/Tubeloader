services:
  tubeloader:
    build:
      context: "${TUBELOADER_GIT_URL:?Set TUBELOADER_GIT_URL to your public Git clone URL}"
    restart: unless-stopped
    init: true
    ports:
      - "${TUBELOADER_BIND_IP:-127.0.0.1}:${TUBELOADER_PORT:-8765}:8765"
    environment:
      TUBELOADER_ALLOWED_HOSTS: "${TUBELOADER_SERVER_HOST:-localhost}:${TUBELOADER_PORT:-8765}"
      TUBELOADER_MAX_DURATION: "${TUBELOADER_MAX_DURATION:-7200}"
      TUBELOADER_MAX_DOWNLOAD_MB: "${TUBELOADER_MAX_DOWNLOAD_MB:-2048}"
      TUBELOADER_MIN_FREE_MB: "${TUBELOADER_MIN_FREE_MB:-1024}"
    volumes:
      - downloads:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  downloads:

