name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: docker compose config --quiet
      - run: docker compose build --pull
      - run: docker compose up -d --wait --wait-timeout 90
      - name: Check API and non-root process
        run: |
          curl --fail http://127.0.0.1:8765/healthz
          test "$(docker compose exec -T tubeloader id -u)" = "10001"
          docker compose exec -T tubeloader deno --version
          docker compose exec -T tubeloader python -c "import pathlib; p=pathlib.Path('/data/ci-probe'); p.write_text('ok'); p.unlink()"
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop test stack
        if: always()
        run: docker compose down

